<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>용어집 · CPO 정보방</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body data-page="glossary">
  <header class="app-header" id="app-header"></header>
  <main class="wrap">
    <div class="kicker">Glossary</div>
    <h1>CPO 기초 용어집</h1>
    <p class="lede">사업 역할, 규제, 설비, 한전 전력, 로밍 프로토콜, 요금, 운영 지표를 한글로 풀어 두었습니다. 각 항목의 ‘CPO가 기억할 점’부터 읽어도 됩니다.</p>
    <form class="search-box" id="glossary-search">
      <input id="glossary-q" type="search" placeholder="OCPP, 로밍, 보조금, 가동률…" autocomplete="off" />
      <button type="submit">찾기</button>
    </form>
    <div class="section-head">
      <div class="chips" id="cat-chips"></div>
      <span class="muted" id="term-count"></span>
    </div>
    <div class="term-list" id="term-list"></div>
  </main>
  <p class="footer">정의는 실무 학습용 요약입니다. 법령·요금·표준 원문은 출처에서 확인하세요.</p>
  <script src="./data/content.js?v=3"></script>
  <script src="./js/search.js?v=3"></script>
  <script src="./js/app.js?v=3"></script>
</body>
</html>
