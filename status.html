<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>충전기 현황 · CPO 정보방</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body data-page="status">
  <header class="app-header" id="app-header"></header>
  <main class="wrap">
    <div class="kicker">Apartment desk</div>
    <h1>아파트 단지 충전기 현황</h1>
    <p class="lede">영업기획팀 자료 <b>충전기 아파트 정보 v0.1</b>를 검색합니다. 단지명·주소·CPO로 찾고, 시도·단지분류·설치 여부로 걸러 볼 수 있습니다.</p>
    <form id="status-search">
      <div class="filters">
        <input class="field" id="st-q" type="search" placeholder="단지명, 주소, CPO…" autocomplete="off" />
        <select id="st-region"></select>
        <select id="st-type"></select>
        <select id="st-charger">
          <option value="all">충전기 전체</option>
          <option value="yes">설치</option>
          <option value="no">미설치</option>
        </select>
      </div>
      <button class="btn" type="submit">현황 검색</button>
    </form>
    <div class="section-head">
      <h2>단지</h2>
      <span class="muted" id="st-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>단지명</th><th>지역</th><th>분류</th><th>세대</th><th>수전</th><th>주차면수</th><th>충전기</th><th>CPO</th><th>주소</th>
          </tr>
        </thead>
        <tbody id="st-body"></tbody>
      </table>
    </div>
    <div class="pager" id="st-pager" hidden>
      <button class="btn" type="button" id="st-more">더 보기</button>
    </div>
  </main>
  <p class="footer">단지·충전기 대수는 충전기 아파트 정보_v0.1.xlsx 기준입니다. 실시간 가능 여부는 출처의 공식 데이터를 확인하세요.</p>
  <script src="./data/content.js?v=9"></script>
  <script src="./data/stations.js?v=9"></script>
  <script src="./js/search.js?v=9"></script>
  <script src="./js/app.js?v=9"></script>
</body>
</html>
