<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>FAQ · CPO 정보방</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./css/app.css?v=16" />
</head>
<body data-page="faq">
  <header class="app-header" id="app-header"></header>
  <main class="wrap">
    <div class="kicker">FAQ</div>
    <h1>자주 묻는 질문 (FAQ)</h1>
    <p class="lede">궁금한 내용을 검색해 확인하고, 아래에서 전체 FAQ를 볼 수 있습니다.</p>

    <div id="faq-note" class="qa-note"></div>
    <form class="search-box" id="faq-search">
      <input id="faq-q" type="search" placeholder="질문·답변 검색" autocomplete="off" />
      <button type="submit">검색</button>
    </form>

    <section id="faq-result-section" hidden>
      <div class="section-head">
        <h2>검색 결과</h2>
        <span class="muted" id="faq-result-count"></span>
      </div>
      <div class="term-list" id="faq-results"></div>
    </section>

    <div class="section-head">
      <h2>전체 FAQ</h2>
      <span class="muted" id="faq-all-count"></span>
    </div>
    <div class="term-list" id="faq-all"></div>
  </main>
  <p class="footer">FAQ는 첨부 엑셀 자료를 기준으로 합니다.</p>
  <script src="./data/faq.js?v=16"></script>
  <script src="./js/faq.js?v=16"></script>
  <script src="./js/app.js?v=16"></script>
</body>
</html>
