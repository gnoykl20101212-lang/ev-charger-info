<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>정보수정요청 · CPO 정보방</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./css/app.css?v=16" />
</head>
<body data-page="qa">
  <header class="app-header" id="app-header"></header>
  <main class="wrap">
    <div class="kicker">Request</div>
    <h1>정보수정요청</h1>
    <p class="lede">영업 직원 누구나 궁금한 용어나 충전기 현황에서 바꿔야 할 내용을 남기는 공간입니다. 담당자가 확인 후 <b>완료</b>로 표시합니다.</p>

    <div id="qa-store-note" class="qa-note"></div>

    <form id="qa-form" class="qa-form">
      <div class="qa-form-row">
        <label>분류
          <select id="qa-category"></select>
        </label>
        <label>작성자 <span class="muted">(선택)</span>
          <input id="qa-author" type="text" placeholder="이름 또는 팀" autocomplete="off" />
        </label>
      </div>
      <label>제목
        <input id="qa-title" type="text" placeholder="예: ‘계약전력’ 용어 설명 보강 요청" autocomplete="off" required />
      </label>
      <label>내용
        <textarea id="qa-content" rows="4" placeholder="궁금한 점이나 변경이 필요한 내용을 적어 주세요." required></textarea>
      </label>
      <div class="qa-form-actions">
        <span class="muted" id="qa-form-msg"></span>
        <button class="btn" type="submit">등록</button>
      </div>
    </form>

    <div class="section-head">
      <div class="chips" id="qa-filter"></div>
      <span class="muted" id="qa-count"></span>
    </div>
    <div class="term-list" id="qa-list"></div>
  </main>
  <p class="footer">정보수정요청은 누구나 자유롭게 작성할 수 있습니다. 처리 결과는 담당자가 완료 표시로 남깁니다.</p>

  <script src="./js/firebase-config.js?v=16"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./js/qa.js?v=16"></script>
  <script src="./js/app.js?v=16"></script>
</body>
</html>
